<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4C7D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--surface:#fff;--field:#F7F9FB;--ink:#1B2530;--muted:#5B6977;--line:#D3DAE2;--accent:#2E4C7D;--accent-ink:#fff;--accent-soft:#E1E8F3;--danger:#A3362E;--danger-soft:#F6E2DF;--warn:#86570F;--warn-soft:#F6EAD3;--ok:#2F6E4E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11171E;--surface:#1A222B;--field:#141B22;--ink:#E5EAF0;--muted:#9AA7B5;--line:#2C3743;--accent:#86A7DC;--accent-ink:#0E1620;--accent-soft:#223149;--danger:#E8897F;--danger-soft:#3B2421;--warn:#E3B56C;--warn-soft:#3A2E1A;--ok:#7CC39C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16.5px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:600;font-size:20px;padding:4px 12px 18px;letter-spacing:-.01em}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg,.btn svg{width:22px;height:22px;flex:none}
.nav .nav-aj{margin-top:auto}
main{padding:calc(28px + env(safe-area-inset-top,0px)) 36px 56px;max-width:980px;width:100%}
.solo-movil{display:none!important}
@media (max-width:820px){
 .app{display:block}
 .nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
 .brand,.nav .nav-aj{display:none}
 .nav a{flex:1;flex-direction:column;gap:1px;font-size:11.5px;padding:6px 2px;align-items:center}
 .nav a.on{background:none}
 main{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
 .solo-movil{display:inline-flex!important}
}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tit{flex:1 1 280px;min-width:0}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
h2{font-size:18px;font-weight:600;margin:0}
.fecha,.sub{margin:0;color:var(--muted)}
.fecha{margin-bottom:2px}.sub{margin-top:4px}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.volver{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:500;padding:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.dan{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}
.btn.ancho{width:100%;white-space:normal;text-align:center}
.rapidos{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 10px}
h2.sec{margin:32px 0 10px}
.peligro{color:var(--danger)}
.buscar,input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
.buscar{background:var(--surface);margin:0 0 12px}
textarea{resize:vertical}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
a.row:hover,.row .txt[data-a]:hover .t{color:var(--accent)}
.txt{flex:1;min-width:0}
.txt[data-a]{cursor:pointer}
.t{font-weight:500;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.num{flex:none;min-width:78px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}
.tag{flex:none;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.chk input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--accent);cursor:pointer}
.dias{flex:none;width:62px;text-align:center;border-radius:10px;padding:6px 0;background:var(--accent-soft);color:var(--accent);line-height:1.15}
.dias b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.dias small{font-size:11.5px}
.dias.pronto{background:var(--warn-soft);color:var(--warn)}
.dias.urg{background:var(--danger-soft);color:var(--danger)}
.dias.hecho{background:var(--bg);color:var(--muted)}
.is-hecho .t{text-decoration:line-through;color:var(--muted)}
.imp{flex:none;text-align:right}
.imp b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.imp small{font-size:13px}
.pend{color:var(--warn)}.ok{color:var(--ok)}
.mes{font-size:15.5px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.vacio{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.panel{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel p:first-child{margin-top:0}
.aviso{margin-top:22px;border-color:var(--accent);background:var(--accent-soft)}
.aviso h2{margin-bottom:6px}.aviso p{margin:0}
.cobro{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;text-decoration:none;color:inherit}
.importe{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 26px;margin:0}
.datos dt{font-size:13.5px;color:var(--muted)}
.datos dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.datos .ancho{grid-column:1/-1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fld{grid-column:1/-1;margin-bottom:12px}
.fld.half{grid-column:auto}
@media (max-width:380px){.fld.half{grid-column:1/-1}}
.fld label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.nota{color:var(--muted);font-size:14.5px}
.pie{margin-top:28px;text-align:center}
.addact{display:grid;grid-template-columns:170px 1fr auto;gap:8px;align-items:start}
@media (max-width:600px){.addact{grid-template-columns:1fr}}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 36px 14px 0}
.tl li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl time{font-size:13.5px;color:var(--muted)}
.tl p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.x{position:absolute;right:0;top:0;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.x:hover{background:var(--bg);color:var(--danger)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13.5px;color:var(--muted);font-weight:500}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tot{width:auto;min-width:270px;margin:12px 0 0 auto}
.tot td{border:0;padding:4px}
.tot .gt td{font-weight:600;font-size:18px;border-top:1.5px solid var(--ink);padding-top:8px}
.cobros .row{padding:10px 14px}
.cobros .x{position:static}
dialog{width:min(620px,calc(100% - 20px));max-height:calc(100dvh - 20px);border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,35,.35)}
dialog::backdrop{background:rgba(12,20,30,.45)}
dialog h2{margin-bottom:14px}
.dbody{padding:20px 20px 6px;overflow:auto;max-height:calc(100dvh - 110px)}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.dfoot .izq{margin-right:auto}
.linea{position:relative;display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:8px}
.linea .x{position:static;height:44px}
.ftot{margin:4px 0 0;font-size:17px}
.ftot span{color:var(--muted);font-size:14.5px}
.err{color:var(--danger);min-height:1.2em;margin:6px 0 0}
.mapa{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin:8px 0 6px}
@media (max-width:520px){.mapa{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.sin-sesion .nav{display:none}
body.sin-sesion .app{display:block}
body.sin-sesion main{margin:0 auto}
.login{max-width:420px;margin:8vh auto 0}
.login h1{margin-bottom:6px}
.login .btn{margin-top:8px}
#print{display:none}
@media print{
 .app,#toast,dialog{display:none!important}
 body{background:#fff;color:#000;font-size:11pt}
 #print{display:block}
 #print *{color:#000;border-color:#999}
 .pf header{display:flex;justify-content:space-between;gap:30px;margin-bottom:28px}
 .pf h1{font-size:18pt}.pf h2{font-size:16pt;margin:0 0 4px;text-align:right}
 .pf .pfn p{text-align:right;margin:0}
 .pf h3{font-size:10pt;margin:0 0 4px;font-weight:600}
 .pfc{margin-bottom:24px}.pfc p{margin:0 0 6px}
 .tot .gt td{border-top:1.5px solid #000}
 .pfnotas{white-space:pre-wrap;margin-top:24px}
}
</style>
</head>

<div class="app">
 <nav class="nav" id="nav" aria-label="Secciones">
  <div class="brand">Despacho</div>
  <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>

  <a href="#facturas" data-v="facturas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Facturas</a>

 </nav>
 <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const main=$('#main'),dlg=$('#dlg'),dlgForm=$('#dlgForm');
const ICO_AJ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>';

/* ---------- Datos ---------- */
const KEY='despacho_v1';
const DEF={clientes:[],expedientes:[],eventos:[],facturas:[],ajustes:{despacho:{nombre:'',nif:'',direccion:'',telefono:'',email:'',iban:''},serie:'F',iva:21,irpf:15}};
const copia=o=>JSON.parse(JSON.stringify(o));
function normalizar(d){const s=Object.assign(copia(DEF),d||{});s.ajustes=Object.assign(copia(DEF.ajustes),s.ajustes||{});s.ajustes.despacho=Object.assign({},DEF.ajustes.despacho,s.ajustes.despacho||{});for(const k of ['clientes','expedientes','eventos','facturas'])if(!Array.isArray(s[k]))s[k]=[];return s}
function cargar(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}return normalizar(d)}
let S=cargar();
function guardarLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se han podido guardar los cambios en este dispositivo: el almacenamiento está lleno.')}}

/* ---------- Sincronización con Firebase ---------- */
const CFG={apiKey:"AIzaSyBMKg2E225ofx7OftgmWxyQ8Iw0pW6bxJA",authDomain:"despacho-acd51.firebaseapp.com",databaseURL:"https://despacho-acd51-default-rtdb.europe-west1.firebasedatabase.app",projectId:"despacho-acd51",storageBucket:"despacho-acd51.firebasestorage.app",messagingSenderId:"626026177345",appId:"1:626026177345:web:0982f91044d8424c9437c0"};
const KEY_UID='despacho_uid',KEY_CONF='despacho_conf',COLS=['clientes','expedientes','eventos','facturas'];
let fbOk=false,auth=null,authListo=false,usuario=null,listo=true,refDatos=null,primera=true,conectado=false,pendienteRemoto=false,ultimoRemoto=null;
let conf={};try{conf=JSON.parse(localStorage.getItem(KEY_CONF))||{}}catch(e){}
let syncPrev=Object.assign({},conf);
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function plano(s){const o={};for(const c of COLS)for(const x of s[c])o[c+'/'+x.id]=JSON.stringify(x);o.ajustes=JSON.stringify(s.ajustes);return o}
const huellas=p=>{const o={};for(const k in p)o[k]=hash(p[k]);return o};
const mismo=(a,b)=>{const ka=Object.keys(a);return ka.length===Object.keys(b).length&&ka.every(k=>a[k]===b[k])};
function guardarConf(){try{localStorage.setItem(KEY_CONF,JSON.stringify(conf))}catch(e){}}
function desdeRemoto(v){v=v||{};const d={ajustes:v.ajustes};for(const c of COLS)d[c]=Object.values(v[c]||{});return normalizar(d)}
function save(){guardarLocal();if(!refDatos||primera)return;
 const now=plano(S),h=huellas(now),upd={};
 for(const k in h)if(syncPrev[k]!==h[k])upd[k]=JSON.parse(now[k]);
 for(const k in syncPrev)if(!(k in h))upd[k]=null;
 syncPrev=h;if(!Object.keys(upd).length)return;
 refDatos.update(upd).then(()=>{for(const k in upd){if(upd[k]===null)delete conf[k];else conf[k]=h[k]}guardarConf()}).catch(()=>toast('No se ha podido guardar en la nube. Revisa la conexión.'))}
function aplicarCambios(dest,upd){for(const k in upd){if(k==='ajustes'){if(upd[k])dest.ajustes=normalizar({ajustes:upd[k]}).ajustes;continue}const [c,id]=k.split('/');if(!dest[c])continue;const i=dest[c].findIndex(x=>x.id===id);if(upd[k]===null){if(i>=0)dest[c].splice(i,1)}else if(i>=0)dest[c][i]=upd[k];else dest[c].push(upd[k])}}
function aplicarRemoto(){const nuevo=desdeRemoto(ultimoRemoto),h=huellas(plano(nuevo));if(mismo(h,syncPrev))return;S=nuevo;syncPrev=h;conf=Object.assign({},h);guardarConf();guardarLocal();render()}
function primeraCarga(){listo=true;const remoto=desdeRemoto(ultimoRemoto),hr=huellas(plano(remoto));
 if(localStorage.getItem(KEY_UID)===usuario.uid){
  // Dispositivo ya vinculado: recupera los cambios hechos sin conexión que no llegaron a la nube
  if(COLS.some(c=>S[c].length)){const now=plano(S),hl=huellas(now),pend={};for(const k in hl)if(conf[k]!==hl[k])pend[k]=JSON.parse(now[k]);for(const k in conf)if(!(k in hl))pend[k]=null;aplicarCambios(remoto,pend)}
 }else{
  const nl=COLS.reduce((a,c)=>a+S[c].length,0);
  if(nl&&confirm(`Este dispositivo tiene ${nl} registros guardados antes de iniciar sesión. ¿Quieres añadirlos a tu cuenta?\n\nSi pulsas Cancelar, se descartarán y verás solo los datos de tu cuenta.`)){
   for(const c of COLS){const ids=new Set(remoto[c].map(x=>x.id));remoto[c].push(...S[c].filter(x=>!ids.has(x.id)))}
   if(!remoto.ajustes.despacho.nombre&&S.ajustes.despacho.nombre)remoto.ajustes=S.ajustes}
  localStorage.setItem(KEY_UID,usuario.uid)}
 S=remoto;syncPrev=hr;conf=Object.assign({},hr);guardarConf();save();render()}
function alRemoto(snap){ultimoRemoto=snap.val();if(primera){primera=false;primeraCarga();return}if(dlg.open){pendienteRemoto=true;return}aplicarRemoto()}
dlg.addEventListener('close',()=>{if(pendienteRemoto){pendienteRemoto=false;aplicarRemoto()}});
const textoRed=()=>conectado?'Conectado: los cambios se guardan en la nube al momento.':'Sin conexión: los cambios se guardan en este dispositivo y se enviarán a la nube cuando vuelva la conexión.';
function errAuth(c){return({'auth/invalid-email':'El correo no tiene un formato válido.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/invalid-login-credentials':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/missing-password':'Escribe la contraseña.','auth/too-many-requests':'Demasiados intentos seguidos. Espera unos minutos y vuelve a probar.','auth/network-request-failed':'No hay conexión a internet.','auth/user-disabled':'Este usuario está desactivado.'})[c]||'No se ha podido entrar ('+c+').'}
const loginHTML=()=>`<div class="login"><div class="panel"><h1>Despacho</h1><p class="nota">Entra con el correo y la contraseña de tu usuario de Firebase.</p><form id="loginF"><div class="fld"><label for="lg_e">Correo</label><input id="lg_e" type="email" autocomplete="username" inputmode="email"></div><div class="fld"><label for="lg_p">Contraseña</label><input id="lg_p" type="password" autocomplete="current-password"></div><p class="err" id="lg_err"></p><button class="btn pri ancho" type="submit">Entrar</button></form><button type="button" class="btn ghost ancho" data-a="olvido">He olvidado la contraseña</button></div></div>`;

/* ---------- Utilidades ---------- */
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const nrm2=s=>norm(s).replace(/[º°ª.:\/_-]/g,' ').replace(/\s+/g,' ').trim();
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const num=s=>+String(s??'').replace(/\s/g,'').replace(',','.')||0;
const r2=n=>Math.round(n*100)/100;
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dias=f=>Math.round((new Date(f+'T00:00')-new Date(hoy()+'T00:00'))/864e5);
const fFecha=(f,largo)=>{if(!f)return '';const d=new Date(f+'T00:00');if(isNaN(d))return f;return d.toLocaleDateString('es-ES',largo?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'})};
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);
const byId=(col,id)=>id?S[col].find(x=>x.id===id):undefined;
const cliNom=id=>byId('clientes',id)?.nombre||'Sin cliente';
const expDe=id=>byId('expedientes',id);
const cmpNom=(a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es',{sensitivity:'base'});
const cmpEv=(a,b)=>String(a.fecha).localeCompare(String(b.fecha))||String(a.hora||'99').localeCompare(String(b.hora||'99'));
const cmpExp=(a,b)=>String(b.numero).localeCompare(String(a.numero),'es',{numeric:true});
const cmpFac=(a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.numero).localeCompare(String(a.numero),'es',{numeric:true});
const expOrden=()=>[...S.expedientes].sort((a,b)=>(a.estado==='Archivado')-(b.estado==='Archivado')||cmpExp(a,b));
const expLabel=e=>`${e.numero} ${e.asunto} (${cliNom(e.clienteId)})`;
function toISO(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=m[3];if(y.length===2)y=(+y>50?'19':'20')+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function tot(f){const base=r2((f.lineas||[]).reduce((a,l)=>a+num(l.importe),0));const iva=r2(base*num(f.iva)/100),irpf=r2(base*num(f.irpf)/100),sup=r2(num(f.suplidos));const total=r2(base+iva-irpf+sup);const cobrado=r2((f.cobros||[]).reduce((a,c)=>a+num(c.importe),0));return{base,iva,irpf,sup,total,cobrado,pend:r2(total-cobrado)}}
function sigExp(){const y=String(new Date().getFullYear());const n=S.expedientes.map(e=>String(e.numero||'')).filter(s=>s.startsWith(y+'/')).map(s=>parseInt(s.slice(5))||0);return y+'/'+String(Math.max(0,...n)+1).padStart(3,'0')}
function sigFac(fecha){const p=(S.ajustes.serie||'')+(fecha||hoy()).slice(0,4)+'/';const n=S.facturas.map(f=>String(f.numero||'')).filter(s=>s.startsWith(p)).map(s=>parseInt(s.slice(p.length))||0);return p+String(Math.max(0,...n)+1).padStart(3,'0')}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2800)}
function go(h){if(location.hash===h)render();else location.hash=h}

const opt=(v,l,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(l)}</option>`;
function campo(f,v){const id='f_'+f.k;v=v??'';let inp;
 if(f.t==='select'){const o=(!v||f.o.includes(v))?f.o:[v,...f.o];inp=`<select id="${id}">${o.map(x=>opt(x,x,x===v)).join('')}</select>`}
 else if(f.t==='cliente')inp=`<select id="${id}">${opt('','Elige un cliente',!v)}${[...S.clientes].sort(cmpNom).map(c=>opt(c.id,c.nombre,c.id===v)).join('')}</select>`;
 else if(f.t==='expediente')inp=`<select id="${id}">${opt('','Sin expediente',!v)}${expOrden().map(e=>opt(e.id,expLabel(e),e.id===v)).join('')}</select>`;
 else if(f.t==='area')inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(f.t==='number')inp=`<input id="${id}" type="text" inputmode="decimal" value="${esc(v)}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
 else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
 return `<div class="fld${f.half?' half':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`}

function abrirDlg(cuerpo,alGuardar,alCambiar,izq=''){
 dlgForm.innerHTML=`<div class="dbody">${cuerpo}</div><div class="dfoot">${izq}<button type="button" class="btn ghost" data-a="cerrar">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div>`;
 dlgForm.onsubmit=e=>{e.preventDefault();if(alGuardar()===false)return;dlg.close();save();render()};
 dlgForm.oninput=alCambiar||null;
 dlg.showModal();
 const p=dlgForm.querySelector('input,select,textarea');if(p&&matchMedia('(pointer:fine)').matches)p.focus()}
function formModal(titulo,campos,obj,aplicar,izq=''){
 abrirDlg(`<h2>${esc(titulo)}</h2><div class="grid">${campos.map(f=>campo(f,obj[f.k])).join('')}</div><p class="err" id="err"></p>`,()=>{
  const v={};for(const f of campos)v[f.k]=$('#f_'+f.k).value.trim();
  const falta=campos.find(f=>f.req&&!v[f.k]);if(falta){$('#err').textContent='Falta rellenar: '+falta.l+'.';return false}
  return aplicar(v)},null,izq)}

/* ---------- Piezas de interfaz ---------- */
const vacio=t=>`<div class="vacio">${t}</div>`;
const volver=(h,l)=>`<a class="volver" href="${h}">‹ ${l}</a>`;
const cab=(t,acc='',sub='')=>`<div class="top"><div class="tit"><h1>${esc(t)}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="acc">${acc}</div></div>`;
const sec=(t,acc,cuerpo)=>`<div class="sechead"><h2>${t}</h2>${acc||''}</div>${cuerpo}`;
const noEnc=(h,l)=>volver(h,l)+vacio('Este registro ya no existe.');
const Q={},FL={exp:'Abierto',ag:'pend',fac:'pend'};
const buscador=(k,ph)=>`<input class="buscar" type="search" data-q="${k}" value="${esc(Q[k]||'')}" placeholder="${ph}" aria-label="${ph}">`;
const chips=(k,ops)=>`<div class="chips">${ops.map(([v,l])=>`<button type="button" class="chip${FL[k]===v?' on':''}" data-a="filtro" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
function datos(pares){const p=pares.filter(x=>x[1]);if(!p.length)return '';return `<dl class="panel datos">${p.map(([l,v,html,ancho])=>`<div${ancho?' class="ancho"':''}><dt>${l}</dt><dd>${html?v:esc(v)}</dd></div>`).join('')}</dl>`}

function evRow(e){const d=dias(e.fecha),a=Math.abs(d),x=expDe(e.expedienteId);
 const cls=e.hecho?'hecho':d<=0?'urg':d<=3?'pronto':'';
 const blq=d===0?'<b>Hoy</b>':`<b>${a}</b><small>${d<0?(a===1?'día tarde':'días tarde'):(a===1?'día':'días')}</small>`;
 return `<div class="row${e.hecho?' is-hecho':''}"><label class="chk" title="Marcar como hecho"><input type="checkbox" data-c="hecho" data-id="${e.id}"${e.hecho?' checked':''} aria-label="Hecho"></label><div class="dias ${cls}">${blq}</div><div class="txt" data-a="editEv" data-id="${e.id}"><div class="t">${esc(e.titulo)}</div><div class="s">${esc(e.tipo||'')}, ${fFecha(e.fecha)}${e.hora?' a las '+esc(e.hora):''}${e.lugar?', '+esc(e.lugar):''}</div>${x?`<div class="s">Exp. ${esc(x.numero)}, ${esc(cliNom(x.clienteId))}</div>`:''}</div></div>`}
function expRow(e){return `<a class="row" href="#expediente/${e.id}"><div class="num">${esc(e.numero)}</div><div class="txt"><div class="t">${esc(e.asunto)}</div><div class="s">${esc([cliNom(e.clienteId),e.materia,e.juzgado].filter(Boolean).join(', '))}</div></div>${e.estado==='Archivado'?'<span class="tag">Archivado</span>':''}</a>`}
function facRow(f){const t=tot(f),x=expDe(f.expedienteId);return `<a class="row" href="#factura/${f.id}"><div class="num">${esc(f.numero)}</div><div class="txt"><div class="t">${esc(cliNom(f.clienteId))}</div><div class="s">${fFecha(f.fecha)}${x?', '+esc(x.asunto):''}</div></div><div class="imp"><b>${eur(t.total)}</b>${t.pend>0.004?`<small class="pend">Pendiente ${eur(t.pend)}</small>`:'<small class="ok">Cobrada</small>'}</div></a>`}
function totalesHTML(f,t){return `<table class="tot"><tr><td>Base imponible</td><td class="r">${eur(t.base)}</td></tr><tr><td>IVA ${esc(f.iva)} %</td><td class="r">${eur(t.iva)}</td></tr>${num(f.irpf)?`<tr><td>Retención IRPF ${esc(f.irpf)} %</td><td class="r">−${eur(t.irpf)}</td></tr>`:''}${t.sup?`<tr><td>Suplidos</td><td class="r">${eur(t.sup)}</td></tr>`:''}<tr class="gt"><td>Total</td><td class="r">${eur(t.total)}</td></tr></table>`}

const V={},L={};
V.inicio=()=>{const h=hoy();const pend=S.eventos.filter(e=>!e.hecho).sort(cmpEv);const venc=pend.filter(e=>e.fecha<h);const prox=pend.filter(e=>e.fecha>=h&&dias(e.fecha)<=14);
 const fp=S.facturas.map(tot).filter(t=>t.pend>0.004);const totalP=fp.reduce((a,t)=>a+t.pend,0);
 const nada=!S.clientes.length&&!S.expedientes.length;
 return `<div class="top"><div class="tit"><p class="fecha">${cap(fFecha(h,1))}</p><h1>${esc(S.ajustes.despacho.nombre||'Despacho')}</h1></div><div class="acc"><a class="btn ghost solo-movil" href="#ajustes" aria-label="Ajustes">${ICO_AJ}</a></div></div>
 <div class="rapidos"><button class="btn" data-a="nuevoEv">Nuevo plazo o cita</button><button class="btn" data-a="nuevoExp">Nuevo expediente</button><button class="btn" data-a="nuevoCli">Nuevo cliente</button><button class="btn" data-a="nuevaFac">Nueva factura</button></div>
 ${nada?`<div class="panel aviso"><h2>Para empezar</h2><p>Añade tu primer cliente o trae los datos de tu programa actual desde <a href="#ajustes">Ajustes, Importar datos</a>.</p></div>`:''}
 ${venc.length?`<h2 class="sec peligro">Vencidos sin marcar como hechos</h2><div class="list">${venc.map(evRow).join('')}</div>`:''}
 <h2 class="sec">Próximas dos semanas</h2>${prox.length?`<div class="list">${prox.map(evRow).join('')}</div>`:vacio('No hay plazos, señalamientos ni citas en los próximos 14 días.')}
 <h2 class="sec">Pendiente de cobro</h2><a class="panel cobro" href="#facturas"><span class="importe">${eur(totalP)}</span><span class="nota">${fp.length===1?'1 factura sin cobrar del todo':fp.length+' facturas sin cobrar del todo'}</span></a>`};

L.clientes=()=>{if(!S.clientes.length)return vacio('Todavía no hay clientes. Pulsa «Nuevo cliente» o importa los tuyos desde Ajustes.');
 const q=norm(Q.clientes);const l=S.clientes.filter(c=>!q||norm([c.nombre,c.nif,c.telefono,c.email,c.poblacion].join(' ')).includes(q)).sort(cmpNom);
 if(!l.length)return vacio('Ningún cliente coincide con la búsqueda.');
 return `<div class="list">${l.map(c=>{const n=S.expedientes.filter(e=>e.clienteId===c.id&&e.estado!=='Archivado').length;return `<a class="row" href="#cliente/${c.id}"><div class="txt"><div class="t">${esc(c.nombre)}</div><div class="s">${esc([c.nif,c.telefono,c.poblacion].filter(Boolean).join(', '))||'&nbsp;'}</div></div>${n?`<span class="tag">${n} abierto${n>1?'s':''}</span>`:''}</a>`}).join('')}</div>`};
V.clientes=()=>cab('Clientes',`<button class="btn pri" data-a="nuevoCli">Nuevo cliente</button>`)+buscador('clientes','Buscar por nombre, NIF, teléfono…')+`<div id="lst">${L.clientes()}</div>`;
V.cliente=id=>{const c=byId('clientes',id);if(!c)return noEnc('#clientes','Clientes');
 const ex=S.expedientes.filter(e=>e.clienteId===id).sort(cmpExp);const ids=new Set(ex.map(e=>e.id));
 const ev=S.eventos.filter(e=>!e.hecho&&ids.has(e.expedienteId)).sort(cmpEv);
 const fa=S.facturas.filter(f=>f.clienteId===id).sort(cmpFac);
 const tel=c.telefono?`<a href="tel:${esc(c.telefono.replace(/\s/g,''))}">${esc(c.telefono)}</a>`:'';
 const mail=c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'';
 return volver('#clientes','Clientes')+cab(c.nombre,`<button class="btn" data-a="editCli" data-id="${id}">Editar</button><button class="btn ghost dan" data-a="delCli" data-id="${id}">Borrar</button>`)+
 datos([['Tipo',c.tipo],['NIF o CIF',c.nif],['Teléfono',tel,1],['Correo',mail,1],['Dirección',[c.direccion,[c.cp,c.poblacion].filter(Boolean).join(' ')].filter(Boolean).join(', ')],['Notas',c.notas,0,1]])+
 sec('Expedientes',`<button class="btn sm" data-a="nuevoExp" data-cli="${id}">Nuevo expediente</button>`,ex.length?`<div class="list">${ex.map(expRow).join('')}</div>`:vacio('Sin expedientes.'))+
 sec('Plazos y citas pendientes','',ev.length?`<div class="list">${ev.map(evRow).join('')}</div>`:vacio('Nada pendiente.'))+
 sec('Facturas',`<button class="btn sm" data-a="nuevaFac" data-cli="${id}">Nueva factura</button>`,fa.length?`<div class="list">${fa.map(facRow).join('')}</div>`:vacio('Sin facturas.'))};

L.expedientes=()=>{if(!S.expedientes.length)return vacio('Todavía no hay expedientes. Pulsa «Nuevo expediente» o impórtalos desde Ajustes.');
 const q=norm(Q.expedientes);const l=S.expedientes.filter(e=>FL.exp==='todos'||(e.estado||'Abierto')===FL.exp).filter(e=>!q||norm([e.numero,e.asunto,cliNom(e.clienteId),e.autos,e.juzgado,e.contrario,e.materia].join(' ')).includes(q)).sort(cmpExp);
 return l.length?`<div class="list">${l.map(expRow).join('')}</div>`:vacio('Ningún expediente coincide.')};
V.expedientes=()=>cab('Expedientes',`<button class="btn pri" data-a="nuevoExp">Nuevo expediente</button>`)+chips('exp',[['Abierto','Abiertos'],['Archivado','Archivados'],['todos','Todos']])+buscador('expedientes','Buscar por número, asunto, cliente, autos…')+`<div id="lst">${L.expedientes()}</div>`;
V.expediente=id=>{const e=byId('expedientes',id);if(!e)return noEnc('#expedientes','Expedientes');
 const ev=S.eventos.filter(x=>x.expedienteId===id).sort((a,b)=>(a.hecho-b.hecho)||cmpEv(a,b));
 const act=[...(e.actuaciones||[])].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
 const fa=S.facturas.filter(f=>f.expedienteId===id).sort(cmpFac);
 return volver('#expedientes','Expedientes')+cab(e.asunto,`<button class="btn" data-a="editExp" data-id="${id}">Editar</button><button class="btn ghost dan" data-a="delExp" data-id="${id}">Borrar</button>`,`Expediente ${esc(e.numero)}, <a href="#cliente/${e.clienteId}">${esc(cliNom(e.clienteId))}</a>`)+
 datos([['Estado',e.estado],['Materia',e.materia],['Apertura',fFecha(e.apertura)],['Juzgado o tribunal',e.juzgado],['Nº de procedimiento',e.autos],['Parte contraria',e.contrario],['Letrado contrario',e.letradoContrario],['Procurador',e.procurador],['Notas',e.notas,0,1]])+
 sec('Plazos y citas',`<button class="btn sm" data-a="nuevoEv" data-exp="${id}">Añadir</button>`,ev.length?`<div class="list">${ev.map(evRow).join('')}</div>`:vacio('Sin plazos ni citas.'))+
 sec('Actuaciones','',`<div class="panel"><div class="addact"><input type="date" id="actF" value="${hoy()}" aria-label="Fecha"><textarea id="actT" rows="2" placeholder="Escrito presentado, llamada, notificación…" aria-label="Actuación"></textarea><button class="btn pri" data-a="addAct" data-id="${id}">Añadir</button></div>${act.length?`<ol class="tl">${act.map(a=>`<li><time>${fFecha(a.fecha)}</time><p>${esc(a.texto)}</p><button type="button" class="x" data-a="delAct" data-id="${id}" data-act="${a.id}" aria-label="Borrar actuación">×</button></li>`).join('')}</ol>`:''}</div>`)+
 sec('Facturas',`<button class="btn sm" data-a="nuevaFac" data-exp="${id}">Nueva factura</button>`,fa.length?`<div class="list">${fa.map(facRow).join('')}</div>`:vacio('Sin facturas.'))};

L.agenda=()=>{if(!S.eventos.length)return vacio('La agenda está vacía. Pulsa «Nuevo» para apuntar un plazo, un señalamiento o una cita.');
 const q=norm(Q.agenda);const l=S.eventos.filter(e=>FL.ag==='todos'||(FL.ag==='pend'?!e.hecho:e.hecho)).filter(e=>{if(!q)return true;const x=expDe(e.expedienteId);return norm([e.titulo,e.tipo,e.lugar,x?.numero,x?.asunto,x&&cliNom(x.clienteId)].join(' ')).includes(q)}).sort(cmpEv);
 if(FL.ag==='hecho')l.reverse();
 if(!l.length)return vacio('No hay nada que mostrar con este filtro.');

async function leerHoja(file){

 const filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,dateNF:'yyyy-mm-dd',blankrows:false});
 const hi=filas.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hi<0)throw new Error('El archivo no tiene datos que se puedan leer.');
 const cols=filas[hi].map((h,i)=>String(h).trim()||'Columna '+(i+1));const vistos={};cols.forEach((c,i)=>{if(vistos[c])cols[i]=c+' ('+(++vistos[c])+')';else vistos[c]=1});

 guardarAj:()=>{document.querySelectorAll('[data-d]').forEach(i=>S.ajustes.despacho[i.dataset.d]=i.value.trim());S.ajustes.serie=$('#a_serie').value.trim();S.ajustes.iva=num($('#a_iva').value);S.ajustes.irpf=num($('#a_irpf').value);save();toast('Datos guardados')},
 importar:()=>importar(),
 impCancel:()=>{Object.assign(IMP,{cols:[],rows:[],map:{},nombre:''});render()},
 exportar:()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='despacho-copia-'+hoy()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},
 olvido:()=>{const em=$('#lg_e').value.trim(),er=$('#lg_err');if(!em){er.textContent='Escribe primero tu correo y vuelve a pulsar.';return}auth.sendPasswordResetEmail(em).then(()=>{er.textContent='';toast('Te hemos enviado un correo para cambiar la contraseña.')}).catch(x=>{er.textContent=errAuth(x.code)})},
 salir:()=>{if(!confirm('¿Cerrar sesión? Los datos se quitarán de este dispositivo, pero seguirán guardados en tu cuenta.'))return;if(refDatos){refDatos.off();refDatos=null}for(const k of [KEY,KEY_UID,KEY_CONF])localStorage.removeItem(k);S=normalizar(null);conf={};syncPrev={};auth.signOut()},
 borrarTodo:()=>{if(confirm(fbOk&&usuario?'¿Borrar todos los datos de tu cuenta, en todos tus dispositivos?':'¿Borrar todos los datos de este dispositivo?')&&confirm('No se puede deshacer. ¿Seguro?')){const aj=S.ajustes;S=normalizar({ajustes:aj});save();render();toast('Datos borrados')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.id,b,e)}});
document.addEventListener('submit',e=>{if(e.target.id!=='loginF')return;e.preventDefault();const em=$('#lg_e').value.trim(),pw=$('#lg_p').value,er=$('#lg_err'),b=e.target.querySelector('[type=submit]');er.textContent='';if(!em||!pw){er.textContent='Escribe el correo y la contraseña.';return}b.disabled=true;b.textContent='Entrando…';auth.signInWithEmailAndPassword(em,pw).catch(x=>{b.disabled=false;b.textContent='Entrar';er.textContent=errAuth(x.code)})});
document.addEventListener('input',e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){Q[q]=e.target.value;$('#lst').innerHTML=L[q]()}});
document.addEventListener('change',async e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(!c)return;
 if(c==='hecho'){const ev=byId('eventos',t.dataset.id);if(!ev)return;ev.hecho=t.checked;save();render();toast(t.checked?'Marcado como hecho':'Marcado como pendiente')}
 else if(c==='impDest'){IMP.dest=t.value;IMP.map=adivinar(IMP.cols,IMP.dest);render()}
 else if(c==='impMap'){IMP.map[t.dataset.k]=t.value}
 else if(c==='impFile'){const f=t.files[0];if(!f)return;toast('Leyendo el archivo…');try{const r=await leerHoja(f);Object.assign(IMP,{cols:r.cols,rows:r.rows,nombre:f.name,map:adivinar(r.cols,IMP.dest)});render()}catch(err){toast(err.message||'No se ha podido leer el archivo.')}}
 else if(c==='restaurar'){const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.clientes))throw 0;if(!confirm(`La copia tiene ${d.clientes.length} clientes y ${(d.expedientes||[]).length} expedientes. Sustituirá todos los datos actuales${fbOk&&usuario?', también en la nube':''}. ¿Continuar?`))return;S=normalizar(d);save();render();toast('Copia recuperada')}catch(err){toast('Ese archivo no es una copia de esta app.')}}});

/* ---------- Arranque ---------- */
let ultimo='';
function render(){document.body.classList.toggle('sin-sesion',fbOk&&!usuario);
 if(fbOk&&!authListo){main.innerHTML='<div class="login"><p class="nota">Cargando…</p></div>';return}
 if(fbOk&&!usuario){main.innerHTML=loginHTML();return}
 if(fbOk&&!listo){main.innerHTML='<div class="login"><p class="nota">Cargando tus datos… La primera vez en cada dispositivo hace falta conexión a internet.</p></div>';return}
 const h=location.hash.slice(1)||'inicio';const [v,id]=h.split('/');const secc={cliente:'clientes',expediente:'expedientes',factura:'facturas'}[v]||v;
 document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===secc));
 main.innerHTML=(V[v]||V.inicio)(id);
 if(h!==ultimo){window.scrollTo(0,0);ultimo=h}}
window.addEventListener('hashchange',render);
if(window.firebase){try{firebase.initializeApp(CFG);auth=firebase.auth();auth.languageCode='es';fbOk=true;
 firebase.database().ref('.info/connected').on('value',s=>{conectado=!!s.val();const el=$('#estadoRed');if(el)el.textContent=textoRed()});
 auth.onAuthStateChanged(u=>{if(refDatos){refDatos.off();refDatos=null}authListo=true;usuario=u;primera=true;
  if(u){listo=localStorage.getItem(KEY_UID)===u.uid;refDatos=firebase.database().ref('despacho/'+u.uid);
   refDatos.on('value',alRemoto,err=>{listo=true;render();toast(String(err.code||'').includes('PERMISSION')?'La base de datos ha rechazado el acceso: revisa las reglas.':'Error al leer la nube: '+err.message)})}
  render()})}catch(e){console.error(e);fbOk=false}}
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
