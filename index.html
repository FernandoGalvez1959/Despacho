<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4C7D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--surface:#fff;--field:#F7F9FB;--ink:#1B2530;--muted:#5B6977;--line:#D3DAE2;--accent:#2E4C7D;--accent-ink:#fff;--accent-soft:#E1E8F3;--danger:#A3362E;--danger-soft:#F6E2DF;--warn:#86570F;--warn-soft:#F6EAD3;--ok:#2F6E4E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11171E;--surface:#1A222B;--field:#141B22;--ink:#E5EAF0;--muted:#9AA7B5;--line:#2C3743;--accent:#86A7DC;--accent-ink:#0E1620;--accent-soft:#223149;--danger:#E8897F;--danger-soft:#3B2421;--warn:#E3B56C;--warn-soft:#3A2E1A;--ok:#7CC39C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16.5px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:600;font-size:20px;padding:4px 12px 18px;letter-spacing:-.01em}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg,.btn svg{width:22px;height:22px;flex:none}
.nav .nav-aj{margin-top:auto}
main{padding:calc(28px + env(safe-area-inset-top,0px)) 36px 56px;max-width:980px;width:100%}
.solo-movil{display:none!important}
@media (max-width:820px){
 .app{display:block}
 .nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
 .brand,.nav .nav-aj{display:none}
 .nav a{flex:1;flex-direction:column;gap:1px;font-size:11.5px;padding:6px 2px;align-items:center}
 .nav a.on{background:none}
 main{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
 .solo-movil{display:inline-flex!important}
}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tit{flex:1 1 280px;min-width:0}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
h2{font-size:18px;font-weight:600;margin:0}
.fecha,.sub{margin:0;color:var(--muted)}
.fecha{margin-bottom:2px}.sub{margin-top:4px}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.volver{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:500;padding:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.dan{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}
.btn.ancho{width:100%;white-space:normal;text-align:center}
.rapidos{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 10px}
h2.sec{margin:32px 0 10px}
.peligro{color:var(--danger)}
.buscar,input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
.buscar{background:var(--surface);margin:0 0 12px}
textarea{resize:vertical}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
a.row:hover,.row .txt[data-a]:hover .t{color:var(--accent)}
.txt{flex:1;min-width:0}
.txt[data-a]{cursor:pointer}
.t{font-weight:500;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.num{flex:none;min-width:78px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}
.tag{flex:none;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.chk input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--accent);cursor:pointer}
.dias{flex:none;width:62px;text-align:center;border-radius:10px;padding:6px 0;background:var(--accent-soft);color:var(--accent);line-height:1.15}
.dias b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.dias small{font-size:11.5px}
.dias.pronto{background:var(--warn-soft);color:var(--warn)}
.dias.urg{background:var(--danger-soft);color:var(--danger)}
.dias.hecho{background:var(--bg);color:var(--muted)}
.is-hecho .t{text-decoration:line-through;color:var(--muted)}
.imp{flex:none;text-align:right}
.imp b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.imp small{font-size:13px}
.pend{color:var(--warn)}.ok{color:var(--ok)}
.mes{font-size:15.5px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.vacio{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.panel{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel p:first-child{margin-top:0}
.aviso{margin-top:22px;border-color:var(--accent);background:var(--accent-soft)}
.aviso h2{margin-bottom:6px}.aviso p{margin:0}
.cobro{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;text-decoration:none;color:inherit}
.importe{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px;margin:0;padding:12px 14px}
.datos dt{font-size:12.5px;color:var(--muted)}
.datos dd{margin:1px 0 0;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.datos .nd{color:var(--muted)}
.datos .ea{font-weight:600;color:var(--accent)}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--danger);cursor:pointer;min-height:0}
.lnk:hover{text-decoration:underline}
.datos .ancho{grid-column:1/-1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fld{grid-column:1/-1;margin-bottom:12px}
.fld.half{grid-column:auto}
@media (max-width:380px){.fld.half{grid-column:1/-1}}
.fld label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.nota{color:var(--muted);font-size:14.5px}
.pie{margin-top:28px;text-align:center}
.addact{display:grid;grid-template-columns:170px 1fr auto;gap:8px;align-items:start}
@media (max-width:600px){.addact{grid-template-columns:1fr}}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 72px 14px 0}
.tl .x.mail{right:36px;font-size:18px;color:var(--accent)}
.tl .x.mail:hover{color:var(--accent);background:var(--accent-soft)}
.tl li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl time{font-size:13.5px;color:var(--muted)}
.tl p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.x{position:absolute;right:0;top:0;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.x:hover{background:var(--bg);color:var(--danger)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13.5px;color:var(--muted);font-weight:500}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tot{width:auto;min-width:270px;margin:12px 0 0 auto}
.tot td{border:0;padding:4px}
.tot .gt td{font-weight:600;font-size:18px;border-top:1.5px solid var(--ink);padding-top:8px}
.cobros .row{padding:10px 14px}
.cobros .x{position:static}
dialog{width:min(620px,calc(100% - 20px));max-height:calc(100dvh - 20px);border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,35,.35)}
dialog::backdrop{background:rgba(12,20,30,.45)}
dialog h2{margin-bottom:14px}
.dbody{padding:20px 20px 6px;overflow:auto;max-height:calc(100dvh - 110px)}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.dfoot .izq{margin-right:auto}
.linea{position:relative;display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:8px}
.linea .x{position:static;height:44px}
.ftot{margin:4px 0 0;font-size:17px}
.ftot span{color:var(--muted);font-size:14.5px}
.err{color:var(--danger);min-height:1.2em;margin:6px 0 0}
.mapa{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin:8px 0 6px}
@media (max-width:520px){.mapa{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.sin-sesion .nav{display:none}
body.sin-sesion .app{display:block}
body.sin-sesion main{margin:0 auto}
.login{max-width:420px;margin:8vh auto 0}
.login h1{margin-bottom:6px}
.login .btn{margin-top:8px}

.campo{gap:6px;padding:10px 12px}
.campo .btn.sm{min-width:42px;padding:0 10px}
.campo .btn[disabled]{opacity:.35;cursor:default}
.is-oculto .t{color:var(--muted)}
.nuevos{margin-bottom:12px}
.nuevo{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.tl .actimp.neg{color:var(--warn)}
.chip .cnt{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.row.exp-ab{background:var(--accent-soft)}
.row.exp-ce{background:var(--danger-soft)}
.row.exp-ab:hover,.row.exp-ce:hover{filter:brightness(.98)}
.row.cli{padding:11px 16px}
.abog{flex:none;max-width:38%;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nasu{flex:none;min-width:34px;height:30px;padding:0 10px;font-size:14px;white-space:nowrap;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center}
.nasu .corto{display:none}
@media (max-width:560px){.nasu .largo{display:none}.nasu .corto{display:inline;margin-right:3px}}
.orden{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.orden .chips{margin-bottom:12px}.orden .nota{margin-bottom:12px}
.mes .cnt{font-weight:400;font-size:13px}
.mes.grp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;color:var(--ink)}
.mes.grp .cnt{color:var(--muted);font-size:13.5px}
.prev{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prev .addact{flex:1;min-width:220px}
.addmov{display:grid;grid-template-columns:150px 1fr 110px 110px auto;gap:8px}
@media (max-width:640px){.addmov{grid-template-columns:1fr 1fr}.addmov #mvC,.addmov .btn{grid-column:1/-1}}
.tabla{overflow-x:auto;margin-top:14px}
table.mov{font-size:14.5px}
table.mov th.ing,table.mov th.gas{color:var(--muted)}
table.mov tr.editable{cursor:pointer}
.row.tarea .xt{position:static;flex:none;width:36px;height:36px;font-size:22px}
.actpend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.actpend label{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.actpend input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.actpend input[type=date]{width:auto}
.tl .actx{cursor:pointer}.tl .actx:hover p{color:var(--accent)}
.tl .estado-t{font-size:13px;color:var(--muted)}
.tl li.pte .estado-t{color:var(--warn);font-weight:600}
.tl li.pte::before{background:var(--warn)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
.list.agenda .row.ag{display:grid;grid-template-columns:108px 140px minmax(140px,1fr) 2fr;gap:12px;align-items:baseline;padding:11px 16px}

.row.ag .agc{font-size:14.5px;overflow-wrap:anywhere}

@media (max-width:640px){.list.agenda .row.ag{grid-template-columns:92px 1fr;grid-template-areas:"f x" "f c" "f t";gap:2px 12px}
 .row.ag .agf{grid-area:f}.row.ag .agx{grid-area:x}.row.ag .agc{grid-area:c}.row.ag .agt{grid-area:t}.row.cabag{display:none!important}}
.addcont{display:grid;grid-template-columns:1.3fr 1.3fr 1fr auto;gap:8px}
@media (max-width:640px){.addcont{grid-template-columns:1fr}}
.dests{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}

.row.pv .pvc{font-size:14.5px;overflow-wrap:anywhere}

 .row.pv .pvx{grid-area:x}.row.pv .pva{grid-area:a}.row.pv .pvc{grid-area:c}.row.pv .pvi{grid-area:i;align-self:center}}

.row.copia{flex-wrap:wrap}

 .app,#toast,dialog{display:none!important}
 body{background:#fff;color:#000;font-size:11pt}

 async op(modo,f){const db=await this.abrir();return new Promise((ok,ko)=>{const tx=db.transaction('kv',modo),st=tx.objectStore('kv');let res;const rq=f(st);if(rq)rq.onsuccess=()=>{res=rq.result};tx.oncomplete=()=>ok(res);tx.onerror=()=>ko(tx.error);tx.onabort=()=>ko(tx.error)})},
 get(k){return this.op('readonly',st=>st.get(k))},set(k,v){return this.op('readwrite',st=>st.put(v,k))},del(k){return this.op('readwrite',st=>st.delete(k))}};

/* ---------- Copias automáticas ---------- */
let COPIAS=[],cambiosCopia=0,ultCopiaMs=0,copiando=false;

async function cargarCopias(){try{COPIAS=(await IDB.get('copias'))||[]}catch(e){COPIAS=[]}ultCopiaMs=COPIAS.length?Date.parse(COPIAS[0].fecha):0}
async function hacerCopia(motivo,forzar){if(!cargado||copiando)return;const nc=S.clientes.length,ne=S.expedientes.length;if(!nc&&!ne)return;
 if(!forzar&&!cambiosCopia&&COPIAS.length)return;copiando=true;
 try{const id=String(Date.now()),snap=JSON.parse(JSON.stringify(S));await IDB.set('copia:'+id,snap);
  COPIAS.unshift({id,fecha:new Date().toISOString(),motivo,nc,ne});
  const dia=c=>new Date(c.fecha).toLocaleDateString('es-ES'),limite=Date.now()-30*864e5,quedan=COPIAS.slice(0,MAX_COPIAS),vistos=new Set(quedan.map(dia));
  for(const c of [...COPIAS.slice(MAX_COPIAS)].reverse()){if(Date.parse(c.fecha)>=limite&&!vistos.has(dia(c))){quedan.push(c);vistos.add(dia(c))}}
  quedan.sort((a,b)=>b.fecha.localeCompare(a.fecha));const sobran=COPIAS.filter(c=>!quedan.includes(c));COPIAS.length=0;COPIAS.push(...quedan);
  await IDB.set('copias',COPIAS);for(const c of sobran)await IDB.del('copia:'+c.id).catch(()=>{});cambiosCopia=0;ultCopiaMs=Date.now()}catch(e){console.error(e)}
 copiando=false;if(location.hash==='#copias'&&!dlg.open)render()}
function copiaDiaria(){hacerCopia('Al abrir la app',true)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cambiosCopia&&Date.now()-ultCopiaMs>30*60e3)hacerCopia('Al salir de la app')});
const fCopia=iso=>{const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})+' a las '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
const nombreCopia=d=>'Despacho '+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
function descargarJSON(obj,nombre){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const KEY_DESC='despacho_ultDescarga',KEY_POSP='despacho_posponer';
function avisoCopiaHTML(){if(!S.clientes.length&&!S.expedientes.length)return '';const ult=+localStorage.getItem(KEY_DESC)||0,posp=+localStorage.getItem(KEY_POSP)||0,ahora=Date.now();
 if(ahora-ult<7*864e5||ahora<posp)return '';const dias=ult?Math.floor((ahora-ult)/864e5):0;
 return `<div class="aviso-copia"><span>${ult?`Hace ${dias} días que no descargas una copia de seguridad.`:'Todavía no has descargado ninguna copia de seguridad.'} Guárdala en tu Drive o en el PC.</span><span class="acc"><button class="btn sm pri" data-a="exportar">Descargar copia</button><button class="btn sm ghost" data-a="posponerCopia">Más tarde</button></span></div>`}

/* ---------- Sincronización con Firebase ---------- */
const CFG={apiKey:"AIzaSyBMKg2E225ofx7OftgmWxyQ8Iw0pW6bxJA",authDomain:"despacho-acd51.firebaseapp.com",databaseURL:"https://despacho-acd51-default-rtdb.europe-west1.firebasedatabase.app",projectId:"despacho-acd51",storageBucket:"despacho-acd51.firebasestorage.app",messagingSenderId:"626026177345",appId:"1:626026177345:web:0982f91044d8424c9437c0"};

function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function plano(s){const o={};for(const c of COLS)for(const x of s[c])o[c+'/'+x.id]=JSON.stringify(x);o.ajustes=JSON.stringify(s.ajustes);return o}

const mismo=(a,b)=>{const ka=Object.keys(a);return ka.length===Object.keys(b).length&&ka.every(k=>a[k]===b[k])};

 Object.assign(pend,upd);guardarPend();enviar(upd)}
async function enviar(upd){const ks=Object.keys(upd);
 for(let i=0;i<ks.length;i+=300){const parte={};for(const k of ks.slice(i,i+300))parte[k]=upd[k];
  try{await refDatos.update(parte);const js=JSON.stringify;for(const k in parte)if(k in pend&&js(pend[k])===js(parte[k]))delete pend[k];guardarPend()}
  catch(e){toast('No se ha podido guardar en la nube ('+((e&&e.message)||'error')+'). Se volverá a intentar.');clearTimeout(tReint);tReint=setTimeout(reintentar,30000);return}}}

function aplicarCambios(dest,upd){for(const k in upd){if(k==='ajustes'){if(upd[k])dest.ajustes=normalizar({ajustes:upd[k]}).ajustes;continue}const [c,id]=k.split('/');if(!dest[c])continue;const i=dest[c].findIndex(x=>x.id===id);if(upd[k]===null){if(i>=0)dest[c].splice(i,1)}else if(i>=0)dest[c][i]=upd[k];else dest[c].push(upd[k])}}
function aplicarRemoto(){const base=desdeRemoto(ultimoRemoto),hb=huellas(plano(base));
 // Lo que aún no ha confirmado la nube se mantiene: nunca se pierde un cambio local
 const nuevo=Object.keys(pend).length?(aplicarCambios(base,copia(pend)),base):base;

function primeraCarga(){listo=true;const base=desdeRemoto(ultimoRemoto),hb=huellas(plano(base)),nuevo=desdeRemoto(ultimoRemoto);

function toISO(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=m[3];if(y.length===2)y=(+y>50?'19':'20')+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}

 if(c==='hecho'&&String(t.dataset.id).startsWith('act|')){const {a}=actDe(t.dataset.id);if(a){a.pendiente=!t.checked;save();render();toast(t.checked?'Tarea terminada. Sigue en Actuaciones':'Marcada como pendiente')}}
 else if(c==='hecho'){const ev=byId('eventos',t.dataset.id);if(!ev)return;ev.hecho=t.checked;save();render();toast(t.checked?'Marcado como hecho':'Marcado como pendiente')}
 else if(c==='impDest'){IMP.dest=t.value;IMP.map=adivinar(IMP.cols,IMP.dest);IMP.nuevos={};render()}

/* ---------- Arranque ---------- */
let ultimo='';
function render(){if(!cargado){main.innerHTML='<div class="login"><p class="nota">Cargando…</p></div>';return}
 document.body.classList.toggle('sin-sesion',fbOk&&!usuario);
 if(fbOk&&!authListo){main.innerHTML='<div class="login"><p class="nota">Cargando…</p></div>';return}
 if(fbOk&&!usuario){main.innerHTML=loginHTML();return}

 if(migrar())save();
 main.innerHTML=avisoCopiaHTML()+(V[v]||V.inicio)(id);
 if(h!==ultimo){window.scrollTo(0,0);ultimo=h}}
window.addEventListener('hashchange',render);
function iniciarFirebase(){if(window.firebase){try{firebase.initializeApp(CFG);auth=firebase.auth();auth.languageCode='es';fbOk=true;
 firebase.database().ref('.info/connected').on('value',s=>{conectado=!!s.val();const el=$('#estadoRed');if(el)el.textContent=textoRed()});
 auth.onAuthStateChanged(u=>{if(refDatos){refDatos.off();refDatos=null}authListo=true;usuario=u;primera=true;
  if(u){listo=localStorage.getItem(KEY_UID)===u.uid;refDatos=firebase.database().ref('despacho/'+u.uid);
   refDatos.on('value',alRemoto,err=>{listo=true;render();toast(String(err.code||'').includes('PERMISSION')?'La base de datos ha rechazado el acceso: revisa las reglas.':'Error al leer la nube: '+err.message)})}
  render()})}catch(e){console.error(e);fbOk=false}}}
async function arrancar(){let d=null;
 try{d=await IDB.get('S');pend=(await IDB.get('pend'))||{}}catch(e){console.error(e)}
 let deLS=null;try{deLS=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d&&deLS)d=deLS;
 S=normalizar(d);cargado=true;baseLocal=huellas(plano(S));await cargarCopias();{let n=0;const t=setInterval(()=>{n++;const listoNube=!fbOk||(usuario&&!primera);if(listoNube||n>30){clearInterval(t);if(listoNube)copiaDiaria()}},3000)}
 // libera el espacio de localStorage, que comparten todas tus apps de GitHub Pages
 if(deLS){try{await IDB.set('S',S);localStorage.removeItem(KEY)}catch(e){}}
 localStorage.removeItem(KEY_CONF);
 iniciarFirebase();render()}
render();arrancar();
